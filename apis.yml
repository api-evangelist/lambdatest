- aid: lambdatest:app-automation-api
  name: LambdaTest App Automation API
  description: >-
    REST API for managing mobile app test automation on real devices and emulators/simulators. Supports
    uploading iOS (.ipa) and Android (.apk/.aab) apps, listing devices by region, managing app versions,
    and retrieving concurrency details. Base URLs differ between real device and virtual device workflows.
  humanURL: https://www.lambdatest.com/support/docs/app-testing-apis/
  baseURL: https://mobile-api.lambdatest.com
